server {
    listen 80;
    server_name wall.zongtech.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/campuswall-certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }

    access_log /www/wwwlogs/campuswall-web-access.log;
    error_log /www/wwwlogs/campuswall-web-error.log;
}

server {
    # Port 443 is reserved by the existing Xray service on this host.
    # Cloudflare Origin Rules route wall.zongtech.xyz to this HTTPS port.
    listen 8443 ssl;
    http2 on;
    server_name wall.zongtech.xyz;

    ssl_certificate /etc/campuswall/tls/wall.zongtech.xyz.pem;
    ssl_certificate_key /etc/campuswall/tls/wall.zongtech.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusWallWebSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/campuswall/cloudflare-realip.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /www/wwwroot/campuswall-react/frontend/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/campuswall-web-access.log;
    error_log /www/wwwlogs/campuswall-web-error.log;
}
