name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 40
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: campus_wall
      PGUSER: campus_wall
      PGPASSWORD: campus_wall_ci
      SECRET_KEY: ci-only-secret-not-for-production
      HOST: 127.0.0.1
      PORT: 5412
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Start native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            echo "CI runner OS: ${PRETTY_NAME:-$ID} $(uname -m)"
          fi
          postgres_ready() {
            sudo -u postgres psql --set=ON_ERROR_STOP=on -c 'SELECT 1' >/dev/null 2>&1
          }
          start_postgres() {
            if command -v pg_lsclusters >/dev/null; then
              sudo pg_lsclusters --no-header | while read -r ver name _ state _; do
                if [ "$state" != "online" ]; then
                  sudo pg_ctlcluster "$ver" "$name" start || true
                fi
              done
            fi
            if command -v systemctl >/dev/null; then
              for unit in postgresql.service postgresql postgresql@16-main postgresql@15-main postgresql@14-main; do
                sudo systemctl start "$unit" 2>/dev/null || true
              done
            else
              sudo service postgresql start 2>/dev/null || true
            fi
          }
          install_postgres() {
            if command -v apt-get >/dev/null; then
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql postgresql-contrib
            elif command -v dnf >/dev/null; then
              sudo dnf install -y postgresql-server postgresql
              sudo postgresql-setup --initdb 2>/dev/null || sudo postgresql-setup initdb 2>/dev/null || true
            elif command -v yum >/dev/null; then
              sudo yum install -y postgresql-server postgresql
              sudo postgresql-setup --initdb 2>/dev/null || true
            else
              echo "No supported package manager found to install PostgreSQL" >&2
              exit 1
            fi
          }
          start_postgres
          if ! postgres_ready; then
            echo "PostgreSQL is not running; installing the system package"
            install_postgres
            start_postgres
          fi
          for _ in $(seq 1 30); do
            postgres_ready && break
            sleep 1
          done
          postgres_ready
          sudo -u postgres psql --set=ON_ERROR_STOP=on <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'campus_wall') THEN
              CREATE ROLE campus_wall LOGIN PASSWORD 'campus_wall_ci';
            ELSE
              ALTER ROLE campus_wall WITH LOGIN PASSWORD 'campus_wall_ci';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists campus_wall
          sudo -u postgres createdb --owner=campus_wall campus_wall
          PGPASSWORD="$PGPASSWORD" psql \
            --host=127.0.0.1 --port=5432 --username=campus_wall --dbname=campus_wall \
            --set=ON_ERROR_STOP=on --command 'SELECT 1'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:backend
      - run: npm run build
      - name: Check backend syntax
        run: find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smoke test backend
        shell: bash
        run: |
          npm run start:backend > /tmp/campus-wall-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5412/health | grep -q '"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/campus-wall-backend.log
          exit 1
