server {
    listen 80;
    server_name home.zongtech.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name home.zongtech.xyz;

    ssl_certificate /etc/campuswall-homelab/tls/home.zongtech.xyz.pem;
    ssl_certificate_key /etc/campuswall-homelab/tls/home.zongtech.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 11m;

    root /var/www/campuswall/dist;
    index index.html;

    location ^~ /api/ {
        proxy_pass https://api-wall.zongtech.xyz;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api-wall.zongtech.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /static/ {
        proxy_pass https://api-wall.zongtech.xyz;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api-wall.zongtech.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass https://api-wall.zongtech.xyz/health;
        proxy_ssl_server_name on;
        proxy_set_header Host api-wall.zongtech.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
